; Custom Shaders Patch (CSP) configuration. Needs CSP 0.1.79 or newer; rain needs CSP with RainFX
; (public 0.2.x builds) plus a weather plugin (Sol or Pure) selected in Content Manager.
[BASIC]
DESCRIPTION = Autodrom Sosnova 14.11.2026 layout, geometry from CUZK orthophoto + DMR 5G LiDAR

[GRASS_FX]
GRASS_MATERIALS = grass, aerial
OCCLUDING_MATERIALS = road, roadlow, kerb, line, cone, building, barrier, tyre, tape, post, gantry
MASK_MAIN_THRESHOLD = 0.4
MASK_MAIN_OFFSET = 0.1
MASK_RED_THRESHOLD = 0.8
MASK_RED_OFFSET = 0.0
SHAPE_SIZE = 0.8, 1.0
SHAPE_TIDY = 0.4

[RAIN_FX]
; puddles only in the real hollows of the LiDAR surface (material roadlow); everything else just gets wet
PUDDLES_MATERIALS = roadlow
SOAKING_MATERIALS = road, roadlow, kerb, aerial, grass, barrier, tyre, cone, post, building
SMOOTH_MATERIALS = line, banner, gantry
ROUGH_MATERIALS = wall
LINES_MATERIALS = line
RELIEF_MATERIALS = road, roadlow
RELIEF_TEXTURE_SCALE = 0.5

[SHADER_REPLACEMENT_0]
MATERIALS = road, roadlow
SHADER = ksPerPixelMultiMap_damage_dirt
KEY_0 = ksSpecular
VALUE_0 = 0.35
KEY_1 = ksSpecularEXP
VALUE_1 = 30
KEY_2 = sunSpecular
VALUE_2 = 0.6

[SHADER_REPLACEMENT_1]
MATERIALS = tree
SHADER = ksTree

[SHADER_REPLACEMENT_2]
MATERIALS = tape
SHADER = ksPerPixelAT

[LIGHTING]
; sun position comes from the geotags in ui_track.json (real coordinates of the circuit)
ENABLE_TREES_LIGHTING = 1
