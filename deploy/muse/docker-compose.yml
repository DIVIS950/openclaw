# Muse: an OpenClaw agent with its own cloud desktop, behind HTTPS.
# Run through the `muse` helper (installed by install.sh), which passes --env-file /srv/muse/muse.env.
#
#   caddy    public HTTPS on 80/443: web chat, chat API, live desktop (watch key)
#   gateway  OpenClaw (Claude, WhatsApp, Telegram, web chat, the Muse Sentinel guard)
#   desktop  Chromium with a saved profile; the gateway drives it over CDP, you watch it over noVNC
#
# Fixed addresses matter: Chromium only answers CDP requests addressed to an IP, and the desktop
# only lets the gateway's address connect to CDP.
name: muse

# Bounded logs: the json-file default grows forever on a small always-on server.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    image: muse-openclaw:local
    build:
      context: ../..
      dockerfile: Dockerfile
    # Only the secrets OpenClaw uses; the watch key and VNC password stay out of this container.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in muse.env}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in muse.env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      HOME: /home/node
      TERM: xterm-256color
      NODE_ENV: production
    volumes:
      - ${MUSE_DATA_DIR:-/srv/muse}/openclaw:/home/node/.openclaw
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    init: true
    restart: unless-stopped
    logging: *logging
    depends_on:
      - desktop
    networks:
      muse:
        ipv4_address: 172.30.0.2

  desktop:
    image: muse-desktop:local
    build:
      context: ./desktop
    environment:
      MUSE_CDP_ALLOW_FROM: 172.30.0.2
      MUSE_VNC_PASSWORD: ${MUSE_VNC_PASSWORD:-}
      MUSE_SCREEN: ${MUSE_SCREEN:-1024x1400}
    shm_size: 1gb
    volumes:
      - chrome:/data/chrome
    init: false
    restart: unless-stopped
    logging: *logging
    networks:
      muse:
        ipv4_address: 172.30.0.10

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MUSE_SITE: ${MUSE_SITE:?set MUSE_SITE in muse.env}
      MUSE_WATCH_KEY: ${MUSE_WATCH_KEY:?set MUSE_WATCH_KEY in muse.env}
      MUSE_VNC_PASSWORD: ${MUSE_VNC_PASSWORD:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in muse.env}
      MUSE_GATEWAY_ADDR: 172.30.0.2:18789
      MUSE_DESKTOP_ADDR: 172.30.0.10:6080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging
    depends_on:
      - gateway
    networks:
      muse:
        ipv4_address: 172.30.0.3

  # One-off OpenClaw commands: `muse cli devices list`, `muse cli channels login`, ... (gateway must be up)
  cli:
    image: muse-openclaw:local
    profiles: ["cli"]
    # Only the secrets OpenClaw uses; the watch key and VNC password stay out of this container.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in muse.env}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in muse.env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      HOME: /home/node
      TERM: xterm-256color
      NODE_ENV: production
      BROWSER: echo
    volumes:
      - ${MUSE_DATA_DIR:-/srv/muse}/openclaw:/home/node/.openclaw
    entrypoint: ["node", "dist/index.js"]
    stdin_open: true
    tty: true
    init: true
    logging: *logging
    # Share the gateway's network: OpenClaw commands reach the gateway on loopback as a local client.
    network_mode: "service:gateway"

networks:
  muse:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  chrome:
  caddy-data:
  caddy-config:
