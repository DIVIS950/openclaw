<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kapsa</title>
    <meta name="description" content="Věrnostní karty, kupóny a útraty. Karta vyskočí sama, když přijdeš do obchodu." />
    <meta name="theme-color" content="#f2f2f5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kapsa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Apply a saved light/dark choice before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem("kapsa-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app"><div class="boot"><img src="icons/logo.svg" alt="Kapsa" width="76" height="76" /></div></div>
    <noscript>Kapsa potřebuje zapnutý JavaScript. / Kapsa needs JavaScript.</noscript>
  </body>
</html>
