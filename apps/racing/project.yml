name: Apex
options:
  bundleIdPrefix: ai.openclaw.apex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  RaceCore:
    path: RaceCore

schemes:
  Apex:
    shared: true
    build:
      targets:
        Apex: all
    test:
      targets:
        - package: RaceCore/RaceCoreTests

targets:
  Apex:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: RaceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openclaw.apex
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Sources/Apex.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Apex
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - bluetooth-central
          - audio
        NSLocationWhenInUseUsageDescription: Apex uses GPS to time your laps and compute live delta.
        NSLocationAlwaysAndWhenInUseUsageDescription: Apex keeps timing laps while the screen is locked.
        NSMotionUsageDescription: Apex fuses the motion sensors with GPS for smoother, more precise timing and G-forces.
        NSBluetoothAlwaysUsageDescription: Apex connects to external GPS receivers (RaceBox, NMEA) and controls your GoPro.
        NSLocalNetworkUsageDescription: Apex downloads your onboard video from the GoPro over its Wi-Fi.
        NSPhotoLibraryUsageDescription: Pick an onboard video to sync with your session.
        LSApplicationQueriesSchemes:
          - comgooglemaps
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
