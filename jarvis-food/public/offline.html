<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline · Jarvis Food</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #070a0f;
        color: #e9eff7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      p {
        color: #8794a6;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 14px;
        padding: 12px 22px;
        background: #46d3ff;
        color: #03121b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Jarvis Food needs the internet to place calls.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
