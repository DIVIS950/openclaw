# Optional: lets Tailscale on this server forward the official iPhone app to the gateway.
# Enabled by iphone-setup.sh, which also sets COMPOSE_FILE and OPENCLAW_GATEWAY_BIND=lan in .env.
# The port is published on 127.0.0.1 only; nothing is reachable from the internet.
services:
  openclaw-gateway:
    ports:
      - "127.0.0.1:18789:18789"
