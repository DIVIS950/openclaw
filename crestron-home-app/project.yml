# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: HomeControl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HomeControl:
    type: application
    platform: iOS
    # A shared scheme, so the cloud build can archive the app.
    scheme: {}
    sources:
      - HomeControl
    settings:
      base:
        # Change this to your own reverse-domain id before installing on devices.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.homecontrol
        PRODUCT_NAME: HomeControl
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Set your Apple developer team here or pick it in Xcode › Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        # HomeKit (Apple Home / Matter accessories). Automatic signing adds the capability to the App ID.
        CODE_SIGN_ENTITLEMENTS: HomeControl/HomeControl.entitlements
    info:
      path: HomeControl/Info.plist
      properties:
        CFBundleDisplayName: Home
        # The app only uses standard HTTPS encryption, so TestFlight needs no export paperwork.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Talking to the processor, TVs and cameras on the home network.
        NSLocalNetworkUsageDescription: Home Control connects to your Crestron processor, Samsung TVs and cameras on your home network.
        # Matter and HomeKit accessories, through Apple Home.
        NSHomeKitUsageDescription: Home Control shows and controls the Matter and HomeKit accessories you added in Apple Home.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: Pick a photo to show on a room's card.
