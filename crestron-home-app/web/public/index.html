<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home Control</title>
  <meta name="theme-color" content="#eeedf5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Home">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="app.css">
  <style>
    /* Keep content clear of the status bar and home indicator when added to the Home Screen. */
    :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <button class="ask-fab" id="ask-fab" type="button" data-act="ask-open" aria-label="Ask the home assistant" hidden></button>
  <section class="ask-panel" id="ask-panel" aria-label="Home assistant" hidden></section>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="alert" hidden></div>
  <div id="saver" class="saver" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
